<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090B16"/>
      <stop offset="100%" stop-color="#151932"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background rect -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing shield ring -->
  <path d="M256 64 C330 96 390 100 420 104 C424 230 380 370 256 448 C132 370 88 230 92 104 C122 100 182 96 256 64 Z" 
        fill="none" stroke="url(#shieldGrad)" stroke-width="8" opacity="0.4" filter="url(#glow)"/>
        
  <!-- Main Solid Shield -->
  <path d="M256 80 C322 110 376 114 404 118 C408 232 368 358 256 428 C144 358 104 232 108 118 C136 114 190 110 256 80 Z" 
        fill="#11152A" stroke="url(#shieldGrad)" stroke-width="12"/>

  <!-- Inner Audio Waveform / Guardian Lines -->
  <path d="M256 140 L256 368" stroke="url(#shieldGrad)" stroke-width="14" stroke-linecap="round"/>
  <path d="M220 180 L220 328" stroke="url(#cyanGrad)" stroke-width="12" stroke-linecap="round"/>
  <path d="M292 180 L292 328" stroke="url(#cyanGrad)" stroke-width="12" stroke-linecap="round"/>
  <path d="M184 220 L184 288" stroke="url(#shieldGrad)" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
  <path d="M328 220 L328 288" stroke="url(#shieldGrad)" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
  <path d="M148 244 L148 264" stroke="#A78BFA" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <path d="M364 244 L364 264" stroke="#A78BFA" stroke-width="8" stroke-linecap="round" opacity="0.6"/>

  <!-- Central Pulse / Lock Node -->
  <circle cx="256" cy="254" r="28" fill="#090B16" stroke="url(#shieldGrad)" stroke-width="6"/>
  <circle cx="256" cy="254" r="12" fill="#22D3EE"/>
</svg>
